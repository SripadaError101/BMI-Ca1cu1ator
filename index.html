<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMI Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#16302b; --muted:#5d7570; --line:#d5e0dc;
  --accent:#0f766e; --accent-ink:#ffffff;
  --under:#3b82c4; --normal:#2e9e5b; --over:#d99a1e; --obese:#cf4b3f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b18; --card:#162924; --ink:#e6f1ee; --muted:#93aca6; --line:#274039;
    --accent:#2dd4bf; --accent-ink:#06201c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b18; --card:#162924; --ink:#e6f1ee; --muted:#93aca6; --line:#274039;
  --accent:#2dd4bf; --accent-ink:#06201c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
h1{font-family:Fraunces,Georgia,serif;font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--muted);font-size:.95rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:6px}
input{width:100%;height:48px;padding:0 14px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{margin-top:16px;width:100%;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{margin:12px 0 0;color:var(--obese);font-size:.9rem;min-height:1.2em}
#result{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
#result[hidden]{display:none}
.num{font-family:Fraunces,Georgia,serif;font-size:3.4rem;line-height:1;margin:0}
.cat{font-size:1.25rem;font-weight:600;margin:6px 0 4px}
.msg{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
.scale{position:relative;margin:22px 0 8px;height:12px;border-radius:6px;display:flex;overflow:hidden}
.scale span{height:100%}
.pin{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .4s ease}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.range{margin:16px 0 0;font-size:.9rem;color:var(--muted)}
.note{margin:20px 0 0;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>
</head>
<body>
<main>
  <h1>BMI calculator</h1>
  <p class="sub">Enter your height and weight to see your BMI and what it means.</p>

  <form id="f" novalidate>
    <div class="row">
      <div><label for="he">Height (cm)</label><input id="he" type="number" inputmode="decimal" step="any" placeholder="170"></div>
      <div><label for="we">Weight (kg)</label><input id="we" type="number" inputmode="decimal" step="any" placeholder="65"></div>
    </div>
    <button type="submit">Calculate BMI</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section id="result" hidden aria-live="polite">
    <p class="num" id="num"></p>
    <p class="cat" id="cat"></p>
    <p class="msg" id="msg"></p>
    <div class="scale" aria-hidden="true">
      <span style="flex:3.5;background:var(--under)"></span>
      <span style="flex:6.5;background:var(--normal)"></span>
      <span style="flex:5;background:var(--over)"></span>
      <span style="flex:10;background:var(--obese)"></span>
      <div class="pin" id="pin"></div>
    </div>
    <div class="ticks" aria-hidden="true"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
    <p class="range" id="range"></p>
  </section>

  <p class="note">BMI is a general screening measure. It doesn't account for muscle, age or body type, so talk to a doctor for personal advice.</p>
</main>

<script>
(function(){
  var f=document.getElementById("f"), err=document.getElementById("err");
  var res=document.getElementById("result");
  var cats=[
    {max:18.5,name:"Underweight",color:"var(--under)",msg:"Your BMI is below the healthy range. Consider speaking with a doctor or dietitian."},
    {max:25,name:"Normal weight",color:"var(--normal)",msg:"Your BMI is in the healthy range. Keep up your balanced habits."},
    {max:30,name:"Overweight",color:"var(--over)",msg:"Your BMI is above the healthy range. Small changes in diet and activity can help."},
    {max:Infinity,name:"Obese",color:"var(--obese)",msg:"Your BMI is well above the healthy range. A doctor can help you plan next steps."}
  ];
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var h=parseFloat(document.getElementById("he").value);
    var w=parseFloat(document.getElementById("we").value);
    if(!(h>=50&&h<=272)||!(w>=10&&w<=500)){
      err.textContent="Enter a height of 50–272 cm and a weight of 10–500 kg.";
      res.hidden=true; return;
    }
    err.textContent="";
    var m=h/100, bmi=w/(m*m), c=cats.find(function(x){return bmi<x.max});
    document.getElementById("num").textContent=bmi.toFixed(1);
    var cat=document.getElementById("cat");
    cat.textContent=c.name; cat.style.color=c.color;
    document.getElementById("msg").textContent=c.msg;
    var lo=(18.5*m*m).toFixed(1), hi=(24.9*m*m).toFixed(1);
    document.getElementById("range").textContent="Healthy weight for your height: "+lo+"–"+hi+" kg";
    var pct=Math.min(100,Math.max(0,(bmi-15)/(40-15)*100));
    document.getElementById("pin").style.left=pct+"%";
    res.hidden=false;
  });
})();
</script>
</body>
</html>
